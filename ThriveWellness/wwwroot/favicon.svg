<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <!-- Same circle-and-asterisk mark as _Logo.cshtml, hardcoded to the
         brand maroon token's value from thrive.css instead of currentColor
         (a favicon renders with no surrounding element to inherit a CSS
         color from), with a bolder stroke and slightly smaller circle than
         the full-size logo: 1.4 reads fine at header/footer size, but
         becomes a near-invisible hairline once scaled down to a 16px tab
         icon, and the original radius left too little margin for a
         thicker stroke not to clip against the viewBox edge. -->
    <circle cx="20" cy="20" r="17" fill="none" stroke="#7b2d40" stroke-width="3" />
    <g stroke="#7b2d40" stroke-width="3" stroke-linecap="round">
        <line x1="20" y1="10" x2="20" y2="30" transform="rotate(0 20 20)" />
        <line x1="20" y1="10" x2="20" y2="30" transform="rotate(60 20 20)" />
        <line x1="20" y1="10" x2="20" y2="30" transform="rotate(120 20 20)" />
    </g>
</svg>
